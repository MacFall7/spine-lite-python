[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "spine-lite"
version = "0.2.0a0"
description = "Deterministic policy and effects runtime for LLM tool calls."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mac McFall" }]
keywords = [
  "llm",
  "policy",
  "effects",
  "claude-code",
  "hook",
  "deterministic",
  "tool-use",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Software Development :: Libraries",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
]

[project.optional-dependencies]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "ruff>=0.5",
  "nox>=2024.4.15",
]

[project.scripts]
spine-lite = "spine_lite.cli:app"

[project.urls]
Homepage = "https://github.com/MacFall7/spine-lite-python"
Repository = "https://github.com/MacFall7/spine-lite-python"
Issues = "https://github.com/MacFall7/spine-lite-python/issues"
Changelog = "https://github.com/MacFall7/spine-lite-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/spine_lite"]

[tool.hatch.build.targets.sdist]
include = [
  "src/spine_lite",
  "tests",
  "README.md",
  "LICENSE",
  "CHANGELOG.md",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["site", ".nox", ".venv"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "ANN", # flake8-annotations
  "D",   # pydocstyle
  "S",   # flake8-bandit
  "RUF", # ruff-specific
  "PT",  # flake8-pytest-style
  "SIM", # flake8-simplify
  "TID", # flake8-tidy-imports
  "TC",  # flake8-type-checking
  "N",   # pep8-naming
]
ignore = [
  "D203",   # incompatible with D211
  "D213",   # incompatible with D212
  "ANN401", # Any is gated separately via mypy + comment
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "S603", "ANN", "PT011"]
"noxfile.py" = ["D", "ANN"]
"docs/**" = ["D"]
# Typer introspects the type annotation at runtime to do Path validation,
# so Path can't move to a TYPE_CHECKING block in cli.py.
"src/spine_lite/cli.py" = ["TC003"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/spine_lite", "tests"]
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
module = ["typer.*"]
ignore_missing_imports = false

# Hypothesis's @given / @settings decorators don't propagate types in a way
# mypy --strict accepts as "typed" — disabling disallow_untyped_decorators
# only inside the test suite keeps strict typing on the runtime modules.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--import-mode=importlib",
]
testpaths = ["tests"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/spine_lite"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "\\.\\.\\.",
  "if __name__ == .__main__.:",
]
